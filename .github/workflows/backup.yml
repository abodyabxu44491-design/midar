#
#   gpg --decrypt midar-XXXX.dump.gpg > midar.dump
name: نسخة احتياطية

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      # Optional second copy outside GitHub (any S3-compatible storage, ideally with Object Lock).
      S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION || 'auto' }}
    steps:
      # A backup that was never taken must not look like a success: without its secrets the run fails,
      # so GitHub emails the owner instead of reporting green every night.
      - name: التحقق من الإعداد
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::النسخ الاحتياطي غير مفعّل: أضف BACKUP_DATABASE_URL و BACKUP_PASSPHRASE في أسرار المستودع (Settings ← Secrets and variables ← Actions)."
            exit 1
          fi
      - name: تثبيت أدوات PostgreSQL
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: النسخ والتحقق والتشفير
        run: |
          set -euo pipefail
          umask 077
          BIN=/usr/lib/postgresql/17/bin
          # Retention tier: the 1st of the month is kept about a year, Fridays about four months, other days five weeks.
          if [ "$(date -u +%d)" = "01" ]; then TIER=monthly; DAYS=400
          elif [ "$(date -u +%u)" = "5" ]; then TIER=weekly; DAYS=120
          else TIER=daily; DAYS=35; fi
          NAME="midar-$TIER-$(date -u +%F-%H%M)"
          echo "NAME=$NAME" >> "$GITHUB_ENV"; echo "TIER=$TIER" >> "$GITHUB_ENV"; echo "DAYS=$DAYS" >> "$GITHUB_ENV"
          # Schema, data, constraints, indexes, RLS policies and functions: everything a restore needs.
          $BIN/pg_dump --format=custom --no-owner --dbname "$DB_URL" --file "$NAME.dump"
          $BIN/pg_restore --list "$NAME.dump" > list.txt
          for kind in "TABLE DATA" "POLICY" "INDEX" "FK CONSTRAINT" "FUNCTION"; do
            n=$(grep -c " $kind " list.txt || true)
            echo "$kind: $n"
            [ "$n" -gt 0 ] || { echo "::error::النسخة لا تحتوي $kind"; exit 1; }
          done
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$NAME.dump.gpg" "$NAME.dump"
          sha256sum "$NAME.dump.gpg" > "$NAME.dump.gpg.sha256"
          shred -u "$NAME.dump" list.txt
          SIZE=$(stat -c %s "$NAME.dump.gpg")
          [ "$SIZE" -gt 10000 ] || { echo "::error::حجم النسخة صغير بشكل غير طبيعي ($SIZE بايت)"; exit 1; }
          echo "| النسخة | النوع | مدة الحفظ | الحجم |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| $NAME | $TIER | $DAYS يومًا | $(numfmt --to=iec "$SIZE") |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.dump.gpg
            ${{ env.NAME }}.dump.gpg.sha256
          retention-days: ${{ env.DAYS }}
          if-no-files-found: error
      - name: نسخة ثانية خارج GitHub (اختيارية)
        if: env.S3_BUCKET != ''
        run: |
          set -euo pipefail
          EP=${S3_ENDPOINT:+--endpoint-url $S3_ENDPOINT}
          aws s3 cp $EP "$NAME.dump.gpg" "s3://$S3_BUCKET/$TIER/$NAME.dump.gpg"
          aws s3 cp $EP "$NAME.dump.gpg.sha256" "s3://$S3_BUCKET/$TIER/$NAME.dump.gpg.sha256"
          echo "نُسخت إلى التخزين الخارجي: $TIER/$NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: تنظيف
        if: always()
        run: rm -f midar-*.dump midar-*.dump.gpg list.txt
