# النشر التلقائي على Firebase عند الرفع إلى الفرع main (بعد نجاح الاختبارات)
#
# أسرار GitHub المطلوبة (Settings → Secrets and variables → Actions):
#   GCP_SA_KEY               مفتاح JSON لحساب خدمة له صلاحيات النشر و Cloud SQL Client
#   MIGRATION_DATABASE_URL   postgres://midar_owner:PASSWORD@127.0.0.1:5432/midar
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUD_SQL_INSTANCE: midar-714c1:me-central2:midar-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: تشغيل Cloud SQL Auth Proxy
        run: |
          curl -sSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "$CLOUD_SQL_INSTANCE" &
          sleep 5

      - name: ترحيلات قاعدة البيانات
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: npm run migrate

      - name: النشر على Firebase
        run: npx --yes firebase-tools@13 deploy --only hosting,functions --project midar-714c1 --non-interactive --force
