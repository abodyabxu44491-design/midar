name: Keep alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: إيقاظ الخادم
        env:
          SITE: ${{ vars.SITE_URL || 'https://midar.onrender.com' }}
        run: curl -fsS --max-time 90 "$SITE/healthz" || exit 0
