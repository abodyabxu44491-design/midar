# إبقاء الخادم المجاني مستيقظًا في أوقات الدوام فقط
# الخطة المجانية في Render تُنيم الخادم بعد 15 دقيقة خمول، وأول طلب بعدها يتأخر نحو دقيقة.
# نوقظه كل 10 دقائق من 6 صباحًا إلى 4 عصرًا بتوقيت الرياض، الأحد إلى الخميس فقط،
# حتى لا نستهلك ساعات Render ولا ساعات حوسبة قاعدة البيانات في Neon.
name: Keep alive
on:
  schedule:
    - cron: "*/10 3-13 * * 0-4"   # بتوقيت UTC = 6ص إلى 4م بتوقيت الرياض
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: إيقاظ الخادم
        run: curl -fsS --max-time 90 "${{ vars.SITE_URL }}/healthz" || exit 0
