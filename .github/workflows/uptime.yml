name: مراقبة الموقع
on:
  schedule:
    # Every 3 hours the server only (no database). The database is checked once a day, at 06:07 UTC (09:07 in Riyadh
    # and Sana'a), when schools are using the platform and it is awake anyway: each check of an idle database wakes it,
    # and the free tier is billed by the time it is awake.
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SITE: ${{ vars.SITE_URL || 'https://midarschool.com' }}
    steps:
      - name: فحص الموقع وقاعدة البيانات
        run: |
          set -u
          check() {
            for i in 1 2 3; do
              if curl -fsS --max-time 90 -o /dev/null "$1"; then echo "سليم: $1"; return 0; fi
              echo "محاولة $i فشلت: $1"; sleep 30
            done
            echo "::error::لا يستجيب: $1"; return 1
          }
          ok=0
          check "$SITE/healthz" || ok=1
          if [ "$(date -u +%H)" = "06" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            check "$SITE/healthz/db" || ok=1
          fi
          # The home page's data is cached for hours, so this check does not wake the database.
          if ! curl -fsS --max-time 60 "$SITE/" | grep -q "مدار"; then echo "::error::الصفحة الرئيسية لا تعرض المنصة"; ok=1; fi
          exit $ok
