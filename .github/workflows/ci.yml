# فحص تلقائي مع كل رفع: يطبق الترحيلات على قاعدة بيانات مؤقتة ويشغّل كل الاختبارات
name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://midar_app:ci-app-pass@127.0.0.1:5432/midar
      MIGRATION_DATABASE_URL: postgres://midar_owner:ci-owner-pass@127.0.0.1:5432/midar
      OWNER_PATH: /control-ci-secret-path
      OWNER_USERNAME: owner
      COOKIE_SECURE: "false"
      TRUST_PROXY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: إعداد قاعدة البيانات
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -v owner_pw="'ci-owner-pass'" -v app_pw="'ci-app-pass'" -f db/setup-roles.sql
      - run: npm run migrate
      - name: الاختبارات
        run: |
          export TEST_OWNER_PASSWORD="ci-owner-password-123"
          export OWNER_PASSWORD_HASH="$(node scripts/owner-password.js "$TEST_OWNER_PASSWORD" | grep OWNER_PASSWORD_HASH | cut -d= -f2-)"
          npm test
          SESSION_COOKIE_MODE=single npm test
