# (خيار بديل) الاستضافة على سيرفر خاص بدل Firebase
# /etc/nginx/sites-available/midar — غيّر midar.example.com إلى نطاقك
server {
    listen 80;
    server_name midar.example.com;
    client_max_body_size 4m;   # مرفقات الحركات المالية تصل بصيغة base64
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# ثم: sudo certbot --nginx -d midar.example.com
