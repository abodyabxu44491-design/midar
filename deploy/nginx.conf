# /etc/nginx/sites-available/midar — يجهّزه deploy/install.sh تلقائيًا (ويضع نطاقك بدل midar.example.com)
# شهادة HTTPS يضيفها certbot على هذا الملف نفسه.
server {
    listen 80;
    listen [::]:80;
    server_name midar.example.com;
    client_max_body_size 6m;          # رفع الصور والمرفقات (حد التطبيق 4 ميجا بصيغة base64)
    server_tokens off;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # عنوان الزائر الحقيقي فقط (لا يُقبل ما يرسله المتصفح)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
