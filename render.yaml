services:
  - type: web
    name: midar
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_COOKIE_MODE
        value: separate
      - key: DATABASE_SSL
        value: "true"
      - key: FIREBASE_ANALYTICS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: OWNER_PATH
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD_HASH     # npm run owner:password
        sync: false
      - key: OWNER_TOTP_SECRET       # npm run owner:totp
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ANDROID_PACKAGE
        sync: false
      - key: ANDROID_SHA256
        sync: false
